[build]
  publish = "public"
  functions = "netlify/functions"
  command = "npm install"

[functions]
  node_bundler = "esbuild"

[context.production.environment]
  BLOBS_STORE_PREFIX = "production"
  NETLIFY_SITE_ID = "cdb3dfb5-c8e2-44ce-9f8b-1ca931c4dc1d"
  # Netlify's secrets scanner flags this UUID as high-entropy even though a
  # site ID isn't sensitive; scope the omission to just this key rather than
  # disabling the scan entirely.
  SECRETS_SCAN_OMIT_KEYS = "NETLIFY_SITE_ID"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"
