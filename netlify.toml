[build]
  publish = "public"
  functions = "netlify/functions"
  command = "npm install"

[functions]
  node_bundler = "esbuild"

# BLOBS_STORE_PREFIX and NETLIFY_SITE_ID must NOT be set here: env vars
# declared in netlify.toml are only available during the build, never to
# Functions at runtime (confirmed against Netlify's own docs). Both must be
# set via the Netlify UI/CLI/API instead, scoped to include "Functions".
# See docs/deploy-status-2026-09-27.md for the full story.

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"
