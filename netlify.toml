# Repo is now public (private-repo Git-contributor build restriction no
# longer applies), triggering a fresh deploy of the accumulated fixes.
[build]
  publish = "public"
  functions = "netlify/functions"
  command = "npm install"

[functions]
  node_bundler = "esbuild"

[context.production.environment]
  BLOBS_STORE_PREFIX = "production"
  NETLIFY_SITE_ID = "cdb3dfb5-c8e2-44ce-9f8b-1ca931c4dc1d"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"
