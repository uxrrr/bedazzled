<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Jewelry Appraisal — Sign in</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css" />
</head>
<body>
  <main class="container" style="max-width: 420px; margin-top: 15vh;">
    <h1>Jewelry Appraisal</h1>
    <p>This site is private. No password needed — we'll email you a sign-in link.</p>

    <form id="login-form">
      <input type="email" id="email" placeholder="Email" autocomplete="username" required />
      <p id="error" style="color: #b00020;"></p>
      <p id="success" style="color: #0a7d2c;"></p>
      <button type="submit" id="submit-btn">Email me a sign-in link</button>
    </form>
  </main>

  <script type="module">
    import { currentUser, getGotrue } from "/identity.js";

    (async () => {
      const user = await currentUser();
      if (user) window.location.href = "/index.html";
    })();

    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value;
      const errEl = document.getElementById("error");
      const successEl = document.getElementById("success");
      const btn = document.getElementById("submit-btn");
      errEl.textContent = "";
      successEl.textContent = "";
      btn.setAttribute("aria-busy", "true");
      try {
        const gotrue = await getGotrue();
        await gotrue.requestPasswordRecovery(email);
        successEl.textContent = "Check your email for a sign-in link.";
      } catch (err) {
        errEl.textContent = (err && err.message) || "Could not send sign-in link.";
      } finally {
        btn.removeAttribute("aria-busy");
      }
    });
  </script>
</body>
</html>
