<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Jewelry Appraisal — Sign in</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/theme.css" />
  <style>
    body { display: flex; min-height: 100vh; align-items: center; }
    .login-card { max-width: 420px; margin: 0 auto; width: 100%; }
    .login-card h1 { margin-bottom: 0.25rem; }
    .login-card p.lede { color: var(--pico-muted-color); margin-bottom: 1.5rem; }
    #error, #success { font-size: 0.9rem; margin: 0.5rem 0 0; }
    #error { color: var(--color-error); }
    #success { color: var(--color-success); }
  </style>
</head>
<body>
  <main class="container">
    <article class="login-card">
      <h1>Jewelry Appraisal</h1>
      <p class="lede">This site is private. No password needed — we'll email you a sign-in link.</p>

      <form id="login-form">
        <input type="email" id="email" placeholder="Email" autocomplete="username" required />
        <p id="error"></p>
        <p id="success"></p>
        <button type="submit" id="submit-btn" class="btn-flat" style="width: 100%;">Email me a sign-in link</button>
      </form>
    </article>
  </main>

  <script type="module">
    import { currentUser, getGotrue } from "/identity.js";

    (async () => {
      const user = await currentUser();
      if (user) window.location.href = "/index.html";
    })();

    const COOLDOWN_SECONDS = 60;

    function startCooldown(btn) {
      let remaining = COOLDOWN_SECONDS;
      btn.disabled = true;
      const label = btn.textContent;
      const tick = () => {
        btn.textContent = `Email me a sign-in link (${remaining}s)`;
        if (remaining <= 0) {
          btn.disabled = false;
          btn.textContent = label;
          return;
        }
        remaining -= 1;
        setTimeout(tick, 1000);
      };
      tick();
    }

    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value;
      const errEl = document.getElementById("error");
      const successEl = document.getElementById("success");
      const btn = document.getElementById("submit-btn");
      errEl.textContent = "";
      successEl.textContent = "";
      btn.setAttribute("aria-busy", "true");
      try {
        const gotrue = await getGotrue();
        await gotrue.requestPasswordRecovery(email);
        successEl.textContent = "Check your email for a sign-in link.";
        startCooldown(btn);
      } catch (err) {
        errEl.textContent = (err && err.message) || "Could not send sign-in link.";
      } finally {
        btn.removeAttribute("aria-busy");
      }
    });
  </script>
</body>
</html>
