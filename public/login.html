<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Jewelry Appraisal — Sign in</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css" />
</head>
<body>
  <main class="container" style="max-width: 420px; margin-top: 15vh;">
    <h1>Jewelry Appraisal</h1>
    <p>This site is private. Sign in to continue.</p>

    <form id="login-form">
      <input type="email" id="email" placeholder="Email" autocomplete="username" required />
      <input type="password" id="password" placeholder="Password" autocomplete="current-password" required />
      <p id="error" style="color: #b00020;"></p>
      <button type="submit" id="submit-btn">Sign in</button>
    </form>
    <p><a href="#" id="forgot-link">Forgot password?</a></p>
  </main>

  <script type="module">
    import { currentUser, getGotrue } from "/identity.js";

    (async () => {
      const user = await currentUser();
      if (user) window.location.href = "/index.html";
    })();

    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const errEl = document.getElementById("error");
      const btn = document.getElementById("submit-btn");
      errEl.textContent = "";
      btn.setAttribute("aria-busy", "true");
      try {
        const gotrue = await getGotrue();
        await gotrue.login(email, password, true);
        window.location.href = "/index.html";
      } catch (err) {
        errEl.textContent = (err && err.message) || "Sign in failed. Check your email and password.";
      } finally {
        btn.removeAttribute("aria-busy");
      }
    });

    document.getElementById("forgot-link").addEventListener("click", async (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value;
      if (!email) {
        document.getElementById("error").textContent = "Enter your email above first, then click \"Forgot password?\".";
        return;
      }
      try {
        const gotrue = await getGotrue();
        await gotrue.requestPasswordRecovery(email);
        document.getElementById("error").style.color = "#0a7d2c";
        document.getElementById("error").textContent = "Check your email for a password reset link.";
      } catch (err) {
        document.getElementById("error").textContent = (err && err.message) || "Could not send reset email.";
      }
    });
  </script>
</body>
</html>
