<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Jewelry Appraisal</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css" />
  <style>
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 1rem; }
    .card { text-decoration: none; color: inherit; }
    .card img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: var(--pico-border-radius); background: var(--pico-muted-border-color); }
    .card .placeholder { width: 100%; aspect-ratio: 1; border-radius: var(--pico-border-radius); display: flex; align-items: center; justify-content: center; font-size: 2rem; }
    .card small { color: var(--pico-muted-color); }
    header nav { display: flex; justify-content: space-between; align-items: center; }
  </style>
</head>
<body>
  <main class="container">
    <header>
      <nav>
        <h1>Jewelry Appraisal</h1>
        <div>
          <button id="add-item-btn" class="secondary">+ Add item</button>
          <button id="download-btn" class="secondary">Download everything</button>
          <button id="logout-btn" class="contrast outline">Log out</button>
        </div>
      </nav>
    </header>
    <p id="status" aria-busy="true">Loading items…</p>
    <div class="grid" id="grid" hidden></div>

    <div id="continue-screen" hidden style="max-width: 420px; margin: 10vh auto; text-align: center;">
      <h2 id="continue-heading">Continue</h2>
      <p id="continue-error" style="color: #b00020;"></p>
      <button id="continue-btn">Continue</button>
    </div>
  </main>

  <script type="module">
    import { getPendingAuthAction, currentUser, requireLogin, logout, getGotrue } from "/identity.js";
    import { apiFetch, fetchPhotoObjectUrl, escapeHtml } from "/app.js";

    const pendingAuth = getPendingAuthAction();

    // A GoTrue invite acceptance requires some password value at the API
    // level — there is no passwordless overload. Generate one nobody will
    // ever see or need again; the user signs in via emailed link from here on.
    function generatePassword() {
      const bytes = new Uint8Array(32);
      crypto.getRandomValues(bytes);
      return btoa(String.fromCharCode(...bytes));
    }

    document.getElementById("logout-btn").addEventListener("click", async () => {
      if (!confirm("Log out? You'll need to request a new sign-in link by email to get back in.")) return;
      await logout();
      window.location.href = "/login.html";
    });

    document.getElementById("add-item-btn").addEventListener("click", async () => {
      const title = prompt("Title for the new item?");
      if (!title) return;
      const res = await apiFetch("/.netlify/functions/items-create", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ title }),
      });
      const item = await res.json();
      window.location.href = `/items.html?id=${item.id}`;
    });

    document.getElementById("download-btn").addEventListener("click", async () => {
      const btn = document.getElementById("download-btn");
      btn.setAttribute("aria-busy", "true");
      try {
        const res = await apiFetch("/.netlify/functions/download-everything");
        if (!res.ok) throw new Error("Download failed");
        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `jewelry-appraisal-backup-${Date.now()}.zip`;
        a.click();
        URL.revokeObjectURL(url);
      } catch (err) {
        alert(err.message);
      } finally {
        btn.removeAttribute("aria-busy");
      }
    });

    async function load() {
      const res = await apiFetch("/.netlify/functions/items-list");
      const items = await res.json();
      const grid = document.getElementById("grid");
      const status = document.getElementById("status");
      status.hidden = true;
      grid.hidden = false;

      for (const item of items) {
        const a = document.createElement("a");
        a.className = "card";
        a.href = `/items.html?id=${item.id}`;

        const cover = item.photos.find((p) => p.id === item.coverPhotoId) || item.photos[0];
        if (cover) {
          const img = document.createElement("img");
          img.alt = item.title;
          fetchPhotoObjectUrl(cover.thumb, cover.mime).then((url) => (img.src = url));
          a.appendChild(img);
        } else {
          const placeholder = document.createElement("div");
          placeholder.className = "placeholder";
          placeholder.textContent = "💎";
          a.appendChild(placeholder);
        }

        const label = document.createElement("div");
        label.innerHTML = `<small>#${escapeHtml(String(item.listNumber ?? "—"))}</small><br>${escapeHtml(item.title)}`;
        a.appendChild(label);

        grid.appendChild(a);
      }

      if (items.length === 0) {
        status.hidden = false;
        status.removeAttribute("aria-busy");
        status.textContent = "No items yet. Click \"Add item\" to create one.";
      }
    }

    async function redeemPendingAuth() {
      const errEl = document.getElementById("continue-error");
      const btn = document.getElementById("continue-btn");
      errEl.textContent = "";
      btn.setAttribute("aria-busy", "true");
      try {
        const gotrue = await getGotrue();
        if (pendingAuth.kind === "invite") {
          await gotrue.acceptInvite(pendingAuth.token, generatePassword(), true);
        } else {
          // gotrue.recover() alone fully logs the user in — this app never
          // asks for or sets a password, so there is no follow-up step here.
          await gotrue.recover(pendingAuth.token, true);
        }
        document.getElementById("continue-screen").hidden = true;
        document.getElementById("status").hidden = false;
        load();
      } catch (err) {
        errEl.textContent =
          (err && err.message) ||
          "This link has expired or was already used — request a new sign-in link from the sign-in page.";
      } finally {
        btn.removeAttribute("aria-busy");
        // Clear the token from the URL after every attempt, success or
        // failure, so a reload can never re-submit a spent (or in-flight)
        // token.
        history.replaceState(null, "", "/index.html");
      }
    }

    (async () => {
      // If a session already exists (e.g. an old link clicked while still
      // logged in), skip redemption entirely rather than attempting it.
      if (pendingAuth && !(await currentUser())) {
        document.getElementById("status").hidden = true;
        document.getElementById("continue-heading").textContent =
          pendingAuth.kind === "invite" ? "Finish setting up your account" : "Sign in";
        document.getElementById("continue-btn").textContent =
          pendingAuth.kind === "invite" ? "Set up account" : "Continue signing in";
        document.getElementById("continue-screen").hidden = false;
        document.getElementById("continue-btn").addEventListener("click", redeemPendingAuth, { once: true });
        return;
      }
      if (pendingAuth) history.replaceState(null, "", "/index.html");
      const user = await requireLogin();
      if (user) load();
    })();
  </script>
</body>
</html>
