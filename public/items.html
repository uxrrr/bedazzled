<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Jewelry Appraisal — Item</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/photoswipe@5/dist/photoswipe.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/theme.css" />
  <style>
    .carousel-row { display: flex; align-items: center; gap: 0.75rem; max-width: 620px; }
    .cover-wrap {
      position: relative; flex: 1; aspect-ratio: 1; min-width: 0;
      background: var(--photo-frame-bg); display: flex; align-items: center; justify-content: center;
    }
    .cover-wrap img { max-width: 100%; max-height: 100%; object-fit: contain; cursor: pointer; }
    .carousel-btn {
      flex: none;
      width: 2.25rem; height: 2.25rem; border: 1px solid var(--pico-color); border-radius: 50%;
      background: var(--pico-background-color); color: var(--pico-color); font-size: 1.1rem;
      display: flex; align-items: center; justify-content: center; cursor: pointer;
      padding: 0;
    }
    .thumb-strip { display: flex; gap: 0.6rem; flex-wrap: wrap; justify-content: center; margin-top: 1rem; max-width: 620px; }
    .thumb-strip img {
      width: 68px; height: 68px; object-fit: contain; background: var(--photo-frame-bg);
      cursor: pointer; border: 1px solid transparent; opacity: 0.6;
    }
    .thumb-strip img.is-active { border-color: var(--pico-color); opacity: 1; }
    .note { border-bottom: 1px solid var(--pico-muted-border-color); padding: 0.75rem 0; }
    .note small { color: var(--pico-muted-color); }
    #comps-section { opacity: 0.5; }
  </style>
</head>
<body>
  <main class="container">
    <a href="/index.html">&larr; All items</a>
    <p id="status" aria-busy="true">Loading item…</p>

    <div id="content" hidden>
      <header>
        <span class="eyebrow">Item <span id="listnumber-display"></span> — <span id="category-display"></span></span>
        <h1 class="lot-title" id="title-display"></h1>
      </header>

      <section>
        <div class="carousel-row">
          <button id="carousel-prev" class="carousel-btn" type="button" aria-label="Previous photo" hidden>&#8249;</button>
          <div class="cover-wrap">
            <img id="cover-img" alt="Item photo" />
            <div id="no-photo-placeholder" hidden style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size: 3rem;">💎</div>
          </div>
          <button id="carousel-next" class="carousel-btn" type="button" aria-label="Next photo" hidden>&#8250;</button>
        </div>
        <div class="thumb-strip" id="thumb-strip"></div>
      </section>

      <section>
        <div id="notes-list"></div>
      </section>

      <section id="comps-section">
        <h3>Comps <small>(coming in phase 2)</small></h3>
        <p><small>Links to comparable sales will appear here in a future update.</small></p>
      </section>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/photoswipe@5/dist/umd/photoswipe.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/photoswipe@5/dist/umd/photoswipe-lightbox.umd.min.js"></script>
  <script type="module">
    import { requireLogin } from "/identity.js";
    import { apiFetch, fetchPhotoObjectUrl, escapeHtml } from "/app.js";

    const params = new URLSearchParams(window.location.search);
    const itemId = params.get("id");
    let lightbox = null;
    let currentObjectUrls = [];

    // Object URLs from any previous render must be revoked before creating a
    // new batch, and again on navigation away, or they leak for the rest of
    // the session.
    function revokeCurrentUrls() {
      currentObjectUrls.forEach((u) => URL.revokeObjectURL(u));
      currentObjectUrls = [];
    }
    function trackUrl(url) {
      currentObjectUrls.push(url);
      return url;
    }
    window.addEventListener("beforeunload", revokeCurrentUrls);

    function naturalSize(url) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => resolve({ width: img.naturalWidth, height: img.naturalHeight });
        img.src = url;
      });
    }

    async function render(item) {
      revokeCurrentUrls();

      document.getElementById("status").hidden = true;
      document.getElementById("content").hidden = false;
      document.getElementById("title-display").textContent = item.title;
      document.getElementById("listnumber-display").textContent = item.listNumber ?? "—";
      document.getElementById("category-display").textContent = item.category || "uncategorized";

      const coverImg = document.getElementById("cover-img");
      const placeholder = document.getElementById("no-photo-placeholder");
      const prevBtn = document.getElementById("carousel-prev");
      const nextBtn = document.getElementById("carousel-next");
      const strip = document.getElementById("thumb-strip");

      // Fetch/decrypt every photo's thumb+full in parallel rather than one
      // photo at a time — each fetch is its own network round trip.
      const photoData = await Promise.all(
        item.photos.map(async (photo) => {
          const [thumbUrl, fullUrl] = await Promise.all([
            fetchPhotoObjectUrl(photo.thumb, photo.mime).then(trackUrl),
            fetchPhotoObjectUrl(photo.full, photo.mime).then(trackUrl),
          ]);
          const { width, height } = await naturalSize(fullUrl);
          return { photo, thumbUrl, fullUrl, width, height };
        })
      );

      if (photoData.length === 0) {
        coverImg.hidden = true;
        placeholder.hidden = false;
        prevBtn.hidden = true;
        nextBtn.hidden = true;
        strip.innerHTML = "";
        if (lightbox) lightbox.destroy();
        return;
      }

      coverImg.hidden = false;
      placeholder.hidden = true;

      const dataSource = photoData.map(({ fullUrl, width, height }) => ({
        src: fullUrl,
        width,
        height,
        alt: item.title,
      }));

      const startIndex = Math.max(
        photoData.findIndex(({ photo }) => photo.id === item.coverPhotoId),
        0
      );
      let currentIndex = startIndex;

      const thumbImgs = [];
      strip.innerHTML = "";
      photoData.forEach(({ thumbUrl }, index) => {
        const img = document.createElement("img");
        img.src = thumbUrl;
        img.alt = `Photo ${index + 1} of ${photoData.length}`;
        img.addEventListener("click", () => showPhoto(index));
        strip.appendChild(img);
        thumbImgs.push(img);
      });

      function showPhoto(index) {
        currentIndex = index;
        coverImg.src = photoData[index].fullUrl;
        thumbImgs.forEach((img, i) => img.classList.toggle("is-active", i === index));
      }

      const hasMultiple = photoData.length > 1;
      prevBtn.hidden = !hasMultiple;
      nextBtn.hidden = !hasMultiple;
      prevBtn.onclick = () => showPhoto((currentIndex - 1 + photoData.length) % photoData.length);
      nextBtn.onclick = () => showPhoto((currentIndex + 1) % photoData.length);

      showPhoto(startIndex);

      coverImg.onclick = () => lightbox.loadAndOpen(currentIndex, dataSource);

      if (lightbox) lightbox.destroy();
      lightbox = new PhotoSwipeLightbox({
        pswpModule: PhotoSwipe,
      });
      lightbox.init();

      const notesList = document.getElementById("notes-list");
      notesList.innerHTML = "";
      for (const note of item.notes) {
        const div = document.createElement("div");
        div.className = "note";
        div.innerHTML = `<div>${escapeHtml(note.text)}</div><small>${escapeHtml(note.author)} — ${new Date(note.at).toLocaleString()}</small>`;
        notesList.appendChild(div);
      }
    }

    async function load() {
      const res = await apiFetch(`/.netlify/functions/items-get?id=${encodeURIComponent(itemId)}`);
      if (!res.ok) {
        document.getElementById("status").textContent = "Item not found.";
        return;
      }
      const item = await res.json();
      await render(item);
    }

    (async () => {
      const user = await requireLogin();
      if (user) load();
    })();
  </script>
</body>
</html>
